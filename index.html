<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app draw under the iPhone notch / home bar -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark light" />

    <!-- PWA -->
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />

    <!-- iOS "Add to Home Screen" support -->
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KiBase" />

    <title>KiBase</title>

    <!-- Apply the saved theme before the first paint so there is no flash.
         Dark is the default. -->
    <script>
      try {
        if (JSON.parse(localStorage.getItem("mt.theme") || "\"dark\"") === "dark") document.documentElement.classList.add("dark")
      } catch (e) { document.documentElement.classList.add("dark") }
    </script>

</html>
